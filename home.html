<!DOCTYPE html>
<html = lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="home-bg">

    <div class="home-container">
        <h1 style="color: #1a1a1a">Welcome to the Learning Portal</h1>
        <p class="sub-text">Please select an option to continue.</p>


        <div class="buttons">
            
            <button onclick="location.href='login.html'">Login</button>
        
            <button onclick="exitSite()">Exit</button>
        </div>
    </div>

    <script>
        function exitSite() {
            if(confirm("Are you sure you want to exit?")) {
                window.close(); 
            }
        }
    </script>
</body>
</html>
